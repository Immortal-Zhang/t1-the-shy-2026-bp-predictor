[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worlds-2026-bp-predictor"
version = "0.1.0"
description = "Auditable pre-game professional League of Legends probability models"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<3", "duckdb>=1.1,<2",
  "pyarrow>=17,<24", "catboost>=1.2.7,<2", "scikit-learn>=1.5,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "requests>=2.32,<3", "joblib>=1.4,<2", "matplotlib>=3.9,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
worlds-bp = "worlds_predictor.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
